<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The site's motif at tab size, stacked instead of sequential: a rough line above,
    an ordered one below. Understanding before solving. The social preview draws the
    same idea as one continuous thread (scripts/make-og-image.mjs); at 16px the
    horizontal room for that is gone, so the two states sit one over the other.
    Light tile with an accent frame; for the solid variant, swap the two colours.
  -->
  <rect width="32" height="32" rx="6" fill="#fdfbfb" stroke="#7a1e33" stroke-width="2"/>
  <g fill="none" stroke="#7a1e33" stroke-width="2.6" stroke-linecap="round">
    <path d="M7 11.5c1.6-3.2 3.2 3.2 4.8 0s3.2 3.2 4.8 0 3.2 3.2 4.8 0"/>
    <path d="M7 21h18"/>
  </g>
</svg>
